<div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center mb-2">
  <h2 class="text-0">{{header}}</h2>
  <div>
    @if (editButton) {
      <p-button
        pTooltip="Edit"
        tooltipPosition="bottom"
        icon="pi pi-pencil"
        class="mb-2 "
        [routerLink]="routerLinkEdit"
        [outlined]="true"
      [style]="{
        'background-image':
          'radial-gradient(
            circle at left top,
            #A437DB,
            #43ecf9
          )',
        'color': '#ffffff'
      }"
      ></p-button>
    }
    @if ((currentUser$ | async)?.role === UserRole.ADMIN && addButton) {
      <p-button
        [pTooltip]="tooltip"
        tooltipPosition="bottom"
        icon="pi pi-plus"
        class="mb-2 ml-2 test-button"
        [routerLink]="routerLinkAdd"
        [outlined]="true"
        data-test-id="add-button"
        [style]="{
          'background-image':
            'radial-gradient(
              circle at left top,
              #A437DB,
              #43ecf9
            )',
          'color': '#ffffff'
        }"
      ></p-button>
    }
    @if (backButton) {
      <p-button
        [pTooltip]="tooltip"
        tooltipPosition="bottom"
        icon="pi pi-chevron-left font-bold"
        class="mb-2 ml-2"
        [routerLink]="routerLinkBack"
        [outlined]="true"
        [style]="{
          'background-image':
            'radial-gradient(
              circle at left top,
              #A437DB,
              #43ecf9
            )',
          'color': '#ffffff'
        }"
      ></p-button>
    }
  </div>
</div>
